[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkyard"
version = "0.1.0"
description = "Payment Link catalog-as-code. Sync a JSON catalog to Stripe Products, Prices, and Payment Links."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "Nox Labs" }]
keywords = ["stripe", "payment-links", "catalog"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linkyard = "linkyard.cli:main"

[tool.setuptools]
packages = ["linkyard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
